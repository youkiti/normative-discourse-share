# Manual section overrides for articles that cannot be auto-fixed by patterns.
# Applied during build_corpus() Step 2.5 (after position inference, before sanitisation).
#
# Supported actions:
#   rename_section  — change section_type for sections matching from_type + title_contains
#   set_non_imrad   — force the is_non_imrad flag with a reason string

# --- Acad Med ---

[[overrides]]
pmid = "41672749"
journal = "Acad Med"
reason = "Perspective: 'A path forward...' section functions as discussion"
actions = [
    { action = "rename_section", from_type = "other", title_contains = "path forward", to_type = "discussion" },
]

# NOTE (2026-06-15 IMRaD-59 pass): PMID 39961086 previously had a
# rename_section(other -> methods) override here. It is a NO-OP and was removed:
# by the time overrides apply (Step 2.5), the abstract anchor/force-split has
# already MERGED the six RCA-process "other" sections into a single empty-titled
# `introduction` block (2,427 w; see reports/override_time_sections_2026-06-15.md).
# There is no separate titled section for rename_section to target, and renaming
